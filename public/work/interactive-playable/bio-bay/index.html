<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bioluminescent Bay</title>
<style>
  /* the bay fills whatever frame holds it; two quiet buttons sit bottom right */
  html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none }
  #c { width: 100%; height: 100%; display: block; outline: none }
  #load { position: fixed; left: 50%; top: 50%; width: 160px; height: 2px; margin-left: -80px; background: #16263a }
  #bar { height: 100%; width: 0; background: #5fe3ff; transition: width .2s }
  .btn { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); font: 500 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .14em;
         text-transform: uppercase; color: #cdefff; background: rgba(5, 10, 20, .55); border: 1px solid rgba(95, 227, 255, .35);
         border-radius: 999px; padding: 10px 14px; cursor: pointer; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px) }
  .btn:focus-visible { outline: 2px solid #5fe3ff; outline-offset: 2px }
  #post { right: max(14px, env(safe-area-inset-right)) }
  #tilt { right: calc(max(14px, env(safe-area-inset-right)) + 118px) }
  [hidden] { display: none !important }
</style>
</head>
<body>
<canvas id="c" tabindex="-1"></canvas>
<div id="load"><div id="bar"></div></div>
<button class="btn" id="tilt" hidden>tilt to look</button>
<button class="btn" id="post" hidden>postcard</button>
<script src="Build/Web.loader.js"></script>
<script>
  const canvas = document.getElementById("c"), bar = document.getElementById("bar");
  const touch = matchMedia("(pointer: coarse)").matches;
  const config = {
    dataUrl: "Build/Web.data.unityweb", frameworkUrl: "Build/Web.framework.js.unityweb", codeUrl: "Build/Web.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets", companyName: "hammer", productName: "Bioluminescent Bay", productVersion: "0.1.0",
    webglContextAttributes: { preserveDrawingBuffer: true },   // so a postcard can copy the frame
  };
  if (touch) config.devicePixelRatio = Math.min(window.devicePixelRatio, 1.5);
  createUnityInstance(canvas, config, (p) => (bar.style.width = 100 * p + "%"))
    .then((unity) => {
      window.bay = unity;
      document.getElementById("load").remove();
      document.getElementById("post").hidden = false;
      if (touch && "DeviceOrientationEvent" in window) document.getElementById("tilt").hidden = false;
    })
    .catch((e) => console.error(e));

  // tilt to look: the phone's turn and tilt, relative to how it was held when switched on, go to the walker each frame
  let tilt = null, base = null, sent = 0;
  const wrap = (a) => ((a + 540) % 360) - 180;
  function onOrient(e) {
    if (e.alpha == null) return;
    const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    const pitch = ang === 90 ? -e.gamma : ang === -90 || ang === 270 ? e.gamma : -e.beta;
    tilt = { yaw: -e.alpha, pitch };
    if (!base) base = { ...tilt };
  }
  function pump() {
    if (window.bay && tilt && base) window.bay.SendMessage("Walker", "Tilt", wrap(tilt.yaw - base.yaw).toFixed(2) + "," + (tilt.pitch - base.pitch).toFixed(2));
    requestAnimationFrame(pump);
  }
  document.getElementById("tilt").addEventListener("click", async (ev) => {
    try {
      if (typeof DeviceOrientationEvent.requestPermission === "function" && (await DeviceOrientationEvent.requestPermission()) !== "granted") return;
    } catch (e) { return; }
    base = null; addEventListener("deviceorientation", onOrient);
    if (!sent++) requestAnimationFrame(pump);
    ev.currentTarget.textContent = "tilt on";
  });

  // postcard: the frame on a cream card with a caption, shared where the phone can, saved otherwise
  document.getElementById("post").addEventListener("click", () => {
    requestAnimationFrame(() => {
      const W = canvas.width, H = canvas.height, pad = Math.round(W * 0.035), cap = Math.round(W * 0.07);
      const c = document.createElement("canvas"); c.width = W + 2 * pad; c.height = H + 2 * pad + cap;
      const g = c.getContext("2d");
      g.fillStyle = "#f4f1ea"; g.fillRect(0, 0, c.width, c.height); g.drawImage(canvas, pad, pad);
      g.fillStyle = "#24262b"; g.font = Math.round(cap * 0.34) + "px Georgia, serif"; g.textBaseline = "middle";
      g.fillText("bioluminescent bay", pad, H + pad + cap * 0.58);
      g.font = Math.round(cap * 0.22) + "px ui-monospace, Menlo, monospace"; g.textAlign = "right";
      g.fillText("hammer.ad", c.width - pad, H + pad + cap * 0.58);
      c.toBlob(async (blob) => {
        const file = new File([blob], "bioluminescent-bay.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try { await navigator.share({ files: [file], title: "Bioluminescent bay" }); return; } catch (e) { if (e.name === "AbortError") return; }
        }
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      }, "image/png");
    });
  });
</script>
</body>
</html>
