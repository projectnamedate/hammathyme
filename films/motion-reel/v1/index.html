<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Chain Reaction</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --paper: #eef0ea;
        --blue: #3255a4;
        --pink: #ff48b0;
        --yellow: #ffe800;
        --plate: 5px 4px 0 var(--pink);
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--paper); }
      #world {
        position: absolute; left: 0; top: 0; width: 5760px; height: 3240px;
        transform-origin: 0 0; background: var(--paper); will-change: transform;
      }
      .panel { position: absolute; width: 1920px; height: 1080px; }
      .type { font-family: "Archivo Black", sans-serif; color: var(--blue); text-shadow: var(--plate); line-height: 0.92; }
      .mono { font-family: "Space Mono", monospace; color: var(--blue); letter-spacing: 0.04em; }
      .crop { position: absolute; width: 44px; height: 44px; border-color: var(--blue); border-style: solid; border-width: 0; }
      .panel-no { position: absolute; left: 70px; top: 52px; font-size: 22px; }
      .reg { position: absolute; right: 70px; top: 46px; width: 44px; height: 44px; }
      .letter { display: inline-block; will-change: transform; }

      /* 01 type */
      #p1-head { position: absolute; left: 130px; top: 300px; font-size: 178px; white-space: nowrap; }
      #p1-head .line { display: block; height: 178px; }
      #p1-dot { display: inline-block; width: 128px; }
      #p1-ramp { position: absolute; left: 0; top: 0; overflow: visible; }

      /* 02 data */
      .dom {
        position: absolute; top: 420px; width: 80px; height: 440px; background: var(--blue);
        box-shadow: 6px 5px 0 var(--pink); transform-origin: 100% 100%; will-change: transform;
      }
      .bar-val { position: absolute; width: 80px; text-align: center; font-size: 30px; font-weight: 700; }
      .bar-x { position: absolute; top: 880px; width: 80px; text-align: center; font-size: 22px; }
      #p2-axis { position: absolute; left: 260px; top: 860px; width: 880px; height: 6px; background: var(--blue); transform-origin: 0 50%; }
      #p2-title { position: absolute; left: 260px; top: 170px; font-size: 96px; }
      #p2-sub { position: absolute; left: 264px; top: 280px; font-size: 26px; }
      #odo {
        position: absolute; left: 1180px; top: 360px; width: 600px; height: 300px;
        border: 6px solid var(--blue); box-shadow: 10px 9px 0 var(--pink); background: var(--paper);
      }
      #odo-label { position: absolute; left: 1186px; top: 300px; font-size: 26px; }
      .slot { position: absolute; top: 44px; width: 120px; height: 200px; overflow: hidden; }
      .strip { position: absolute; left: 0; top: 0; width: 120px; will-change: transform; }
      .digit { height: 200px; font-size: 168px; line-height: 200px; text-align: center; }
      #one { position: absolute; left: 0; top: 0; width: 140px; height: 200px; margin: -100px 0 0 -70px; font-size: 196px; line-height: 200px; text-align: center; will-change: transform; }

      /* 03 map */
      #p3-map { position: absolute; left: 160px; top: 180px; overflow: visible; }
      #p3-title { position: absolute; left: 160px; top: 70px; font-size: 26px; }
      .pin { position: absolute; width: 0; height: 0; }
      .pin-body { position: absolute; left: -26px; top: -104px; width: 52px; height: 104px; transform-origin: 50% 100%; will-change: transform; }
      .pin-head { position: absolute; left: 0; top: 0; width: 52px; height: 52px; border-radius: 50%; background: var(--pink); box-shadow: 4px 3px 0 var(--blue); }
      .pin-stem { position: absolute; left: 22px; top: 44px; width: 8px; height: 60px; background: var(--blue); }
      .pin-tag { position: absolute; left: 66px; top: 148px; font-size: 26px; font-weight: 700; padding: 4px 10px; border: 3px solid var(--blue); background: var(--paper); }

      /* 04 ui */
      #card { position: absolute; left: 680px; top: 200px; width: 1080px; height: 700px; border: 6px solid var(--blue); background: var(--paper); box-shadow: 12px 11px 0 var(--pink); }
      #card-title { position: absolute; left: 60px; top: 40px; font-size: 30px; }
      .row-label { position: absolute; left: 60px; font-size: 64px; }
      .tog { position: absolute; left: 834px; width: 180px; height: 90px; border-radius: 45px; border: 6px solid var(--blue); background: var(--paper); }
      .knob { position: absolute; left: 6px; top: 2px; width: 74px; height: 74px; border-radius: 50%; background: var(--blue); will-change: transform; }
      #slider-track { position: absolute; left: 320px; top: 556px; width: 690px; height: 12px; background: var(--blue); }
      #slider-handle { position: absolute; left: 0; top: 0; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; background: var(--yellow); border: 6px solid var(--blue); will-change: transform; }
      #go { position: absolute; left: 320px; top: 540px; width: 200px; height: 200px; border-radius: 50%; background: var(--blue); box-shadow: 8px 7px 0 var(--pink); display: flex; align-items: center; justify-content: center; will-change: transform; }
      #go span { font-family: "Archivo Black", sans-serif; font-size: 78px; color: var(--paper); }
      #cursor { position: absolute; left: 0; top: 0; width: 64px; height: 92px; will-change: transform; }
      #lever { position: absolute; left: 40px; top: 948px; width: 480px; height: 24px; background: var(--blue); box-shadow: 5px 4px 0 var(--pink); transform-origin: 50% 50%; will-change: transform; }
      #fulcrum { position: absolute; left: 250px; top: 972px; width: 0; height: 0; border-left: 30px solid transparent; border-right: 30px solid transparent; border-bottom: 56px solid var(--blue); }
      #rod { position: absolute; left: 0; top: 0; overflow: visible; }

      /* 05 / 06 hammer + tear */
      #ghost { position: absolute; left: 140px; top: 330px; overflow: visible; }
      #p5-cap { position: absolute; left: 150px; top: 860px; font-size: 26px; }
      #hammer3d { position: absolute; left: 0; top: 1080px; width: 4320px; height: 1080px; pointer-events: none; }
      #p6-note { position: absolute; left: 150px; top: 190px; font-size: 64px; }
      #target { position: absolute; left: 660px; top: 240px; overflow: visible; }
      #hole { position: absolute; left: 320px; top: 160px; width: 1280px; height: 760px; clip-path: polygon(50% 50%, 50% 50%, 50% 50%); background: #1d2f5c; }
      #hole-still, #h3-video { position: absolute; left: 0; top: 0; width: 1280px; height: 760px; object-fit: cover; }
      #tear-rim { position: absolute; left: 320px; top: 160px; overflow: visible; }
      #bigball { position: absolute; left: 960px; top: 540px; width: 0; height: 0; }
      #bigball i { position: absolute; left: -100px; top: -100px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle at 36% 32%, #ff86cb 0%, var(--pink) 46%, #dc1470 100%); will-change: transform, opacity; }
      .shard { position: absolute; width: 0; height: 0; border-style: solid; will-change: transform; }

      /* 07 / 08 / 09 bottom row */
      .bar-swatch { position: absolute; top: 800px; width: 150px; height: 110px; }
      #p9-title { position: absolute; left: 150px; top: 300px; font-size: 220px; }
      #p9-sub { position: absolute; left: 156px; top: 780px; font-size: 28px; }
      #word { position: absolute; left: 0; top: 380px; width: 1920px; text-align: center; font-family: "Outfit", sans-serif; font-weight: 900; font-size: 300px; letter-spacing: -0.04em; color: var(--blue); line-height: 1; text-shadow: var(--wplate, 7px 6px 0 #ff48b0); }
      #word .gap { display: inline-block; width: 92px; }
      #url { position: absolute; left: 0; top: 760px; width: 1920px; text-align: center; font-size: 34px; }

      .ball { position: absolute; left: 0; top: 0; width: 100px; height: 100px; margin: -50px 0 0 -50px; border-radius: 50%; background: var(--pink); box-shadow: 5px 4px 0 var(--blue); will-change: transform; }

      #root::after { content: ""; position: absolute; inset: 0; background-image: url("assets/img/paper-grain.png"); background-size: 512px 512px; background-position: var(--gx, 0) var(--gy, 0); mix-blend-mode: multiply; pointer-events: none; }
    </style>
  </head>
