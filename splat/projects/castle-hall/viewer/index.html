    const right = new THREE.Vector3(-tmp.z, 0, tmp.x), v = new THREE.Vector3();
    if (keys.has("KeyW") || keys.has("ArrowUp") || walkTouch) v.add(tmp); if (keys.has("KeyS") || keys.has("ArrowDown")) v.sub(tmp);
    if (keys.has("KeyD")) v.add(right); if (keys.has("KeyA")) v.sub(right);
    if (keys.has("ArrowLeft")) yaw += 1.4 * dt; if (keys.has("ArrowRight")) yaw -= 1.4 * dt;
    if (v.lengthSq()) {   // one axis at a time, so you slide along a wall
      const P = localFrame.position, step = v.normalize().multiplyScalar(1.6 * s * dt);
      if (!isBlocked(P.x + step.x, P.z)) P.x += step.x;
      if (!isBlocked(P.x, P.z + step.z)) P.z += step.z;
    }
    // settle to full size and eye height after an arrival
    const k = Math.min(1, (now() - arrivedAt) / 900);
    localFrame.scale.setScalar(THREE.MathUtils.lerp(localFrame.scale.x, 1, k * 0.2));
    localFrame.position.y = THREE.MathUtils.lerp(localFrame.position.y, groundAt(localFrame.position.x, localFrame.position.z) + EYE * localFrame.scale.x, 0.12);
    // walking into the globe or the light starts the glide
    for (const g of GLIDES) {
      const d = new THREE.Vector3(localFrame.position.x - g.at.x, 0, localFrame.position.z - g.at.z);
      if (now() - arrivedAt > 2500 && d.length() < 1.3 && v.lengthSq() && d.normalize().dot(g.normal) > 0.2) {   // a pause after each arrival, so one held key never runs two worlds together
        const p1 = g.disk.clone().addScaledVector(g.normal, 0.05);
        const look = new THREE.PerspectiveCamera(); look.position.copy(p1); look.lookAt(g.disk.clone().sub(g.normal));   // camera semantics: look down −z
        const camLocal = new THREE.Quaternion().copy(localFrame.quaternion).invert().multiply(look.quaternion);
        glide = { t: 0, dur: 1.8, s0: localFrame.scale.x, p0: localFrame.position.clone(), p1, q0: camera.quaternion.clone(), q1: camLocal, through: g.disk.clone().addScaledVector(g.normal, -0.01) };

      }
    }
  }
  orb.visible = halo.visible = worldAt(localFrame.position.x) === WORLDS.forest;
  orb.scale.setScalar(1 + 0.08 * Math.sin(now() / 400)); 
  // the light and its halo dissolve into the window as you shrink toward it
  orb.material.opacity = THREE.MathUtils.smoothstep(localFrame.scale.x, 0.25, 0.8);
  halo.material.opacity = (0.45 + 0.15 * Math.sin(now() / 600)) * THREE.MathUtils.smoothstep(localFrame.scale.x, 0.2, 0.7);
  frameScale.value = localFrame.scale.x; updateDisks();
  portals.animateLoopHook();

}
